[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-rl-lab"
version = "0.1.0"
description = "A verifier-first lab for coding-agent rollouts and policy optimization."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coding-agent-rl = "coding_agent_rl_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

